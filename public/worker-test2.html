<!DOCTYPE html>
<html><body>
<h2>Worker 高亮测试 V2</h2>
<pre id="output" style="background:#1e1e1e;color:#d4d4d4;padding:10px;border-radius:4px;font-family:monospace;font-size:13px;line-height:1.5;overflow:auto;max-height:400px;"></pre>
<div id="status"></div>
<script>
function log(msg) {
  document.getElementById('output').textContent += msg + '\n';
}
function status(msg) {
  document.getElementById('status').textContent = msg;
}

// 直接用真实代码测试 split
function testSplit() {
  log('=== split 测试 ===');
  
  const realCode = '# 测试评论\n' +
    'def hello(name):\n' +
    '    """文档字符串"""\n' +
    '    print(f"Hello {name}")\n' +
    '\n' +
    'hello("world")';
  
  log('原始代码行数 (JS split by \\n): ' + realCode.split('\n').length);
  log('原始代码行数 (JS split by "\\\\n"): ' + realCode.split('\\n').length);
  
  // 模拟 Worker 里 code.split("\\n") 的效果
  // 在 Worker 源码中，code.split("\\n") 里 "\\n" = newline escape
  // 因为 template literal 把 \\n 转成了 \n 两个字符
  // 而 "\n" 在 JS 中就是换行符！
  
  // 验证："\\n" 和 "\n" 的区别
  var backslashN = "\\n";
  var newlineChar = "\n";
  log('"\\\\n" length: ' + backslashN.length + ' (chars: ' + backslashN.split('').map(function(c){return c.charCodeAt(0);}).join(',') + ')');
  log('"\\n" length: ' + newlineChar.length + ' (chars: ' + newlineChar.split('').map(function(c){return c.charCodeAt(0);}).join(',') + ')');
  
  // 模拟 Worker 中分行的效果
  var workerSourceSplit = realCode.split("\n");
  log('Worker 式 split (code.split("\\n")): ' + workerSourceSplit.length + ' 行');
  for (var i = 0; i < Math.min(3, workerSourceSplit.length); i++) {
    log('  L' + i + ': ' + workerSourceSplit[i].substring(0, 40));
  }
}

// 用 template literal 重现 WORKER_SOURCE
function testWorkerReal() {
  log('\n=== Worker 完整测试 ===');
  
  const WORKER_SOURCE = `
const LANG_DEFS = {
  js: { keywords: "function var let const return if else".split(" "), patterns: [] },
  py: {
    keywords: "def return if else for in print class".split(" "),
    patterns: [
      [/#.*/, "comment"],
      [/"""[\\s\\S]*?"""/, "string"],
      [/'[^']*'/, "string"],
      [/"[^"]*"/, "string"],
      [/\\b\\d+(?:\\.\\d+)?\\b/, "number"],
    ],
  },
};
var LANG_ALIAS = { python: "py" };
function resolveLang(name) { return LANG_DEFS[name] || LANG_DEFS[LANG_ALIAS[name]] || null; }

onmessage = function(e) {
  var data = e.data;
  var code = data.code;
  var language = data.language;
  var id = data.id;
  try {
    var def = resolveLang(language);
    if (!def) {
      var plain = code.split("\\n").map(function(l) { return l ? [{ content: l, types: [] }] : []; });
      postMessage({ id: id, lines: plain, success: true, totalLines: plain.length });
      return;
    }
    var keywordSet = {};
    if (def.keywords) def.keywords.forEach(function(k) { keywordSet[k] = true; });
    
    // THIS split - 用 \\n (two chars in template literal = \n in source)
    var lines = code.split("\\n");
    var resultLines = [];
    
    var lineCount = lines.length;
    
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var tokens = [];
      var pos = 0;
      while (pos < line.length) {
        var ch = line[pos];
        if (/[a-zA-Z_]/.test(ch)) {
          var word = "";
          while (pos < line.length && /[a-zA-Z0-9_]/.test(line[pos])) { word += line[pos]; pos++; }
          if (keywordSet[word]) tokens.push({ content: word, types: ["keyword"] });
          else tokens.push({ content: word, types: [] });
        } else if (/\\d/.test(ch)) {
          var num = "";
          while (pos < line.length && /[0-9.]/.test(line[pos])) { num += line[pos]; pos++; }
          tokens.push({ content: num, types: ["number"] });
        } else {
          tokens.push({ content: ch, types: [] });
          pos++;
        }
      }
      resultLines.push(tokens);
    }
    postMessage({ id: id, lines: resultLines, success: true, totalLines: lineCount });
  } catch (err) {
    postMessage({ id: id, error: err.message, stack: err.stack });
  }
};
`;

  var blob = new Blob([WORKER_SOURCE], {type:'application/javascript'});
  var url = URL.createObjectURL(blob);
  var worker = new Worker(url);
  
  worker.onmessage = function(e) {
    var d = e.data;
    if (d.lines) {
      log('Worker 返回: ' + d.totalLines + ' 行, ' + d.lines.length + ' 组 token');
      for (var i = 0; i < Math.min(d.lines.length, 6); i++) {
        var toks = d.lines[i].map(function(t){return t.types.length ? t.content + '[' + t.types[0] + ']' : t.content;}).join(' ');
        log('  L' + i + ': ' + toks.substring(0, 60));
      }
      status('✅ 成功! ' + d.totalLines + ' 行正确分词');
    }
    if (d.error) {
      log('ERROR: ' + d.error);
      log('STACK: ' + (d.stack || 'none'));
      status('❌ 失败: ' + d.error);
    }
  };
  worker.onerror = function(e) {
    log('WORKER ERROR: ' + e.message);
    status('❌ Worker 错误');
  };
  
  // 用 + 号拼接字符串才能有真换行！
  var testCode = '# 这是注释\n' +
    'def quicksort(arr):\n' +
    '    if len(arr) <= 1:\n' +
    '        return arr\n' +
    '    pivot = arr[0]\n' +
    '    left = [x for x in arr[1:] if x <= pivot]\n' +
    '    right = [x for x in arr[1:] if x > pivot]\n' +
    '    return quicksort(left) + [pivot] + quicksort(right)\n' +
    '\n' +
    'print(quicksort([3, 6, 8, 10, 1, 2, 1]))';
  
  log('测试代码(真换行):\\n' + testCode);
  log('JS split 行数: ' + testCode.split('\n').length);
  worker.postMessage({code: testCode, language: 'py', id: 1});
  status('Worker 已发送...');
}

testSplit();
testWorkerReal();
</script>
</body></html>
